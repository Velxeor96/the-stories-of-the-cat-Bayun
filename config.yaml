# config.yaml — реестр провайдеров и ролей для проекта Warhammer 40K RPG

# ============================================================
# ПРОВАЙДЕРЫ (где брать модели)
# ============================================================
providers:
  kodik:
    name: "KodikRouter"
    base_url: "https://api.kodikrouter.ru/v1"
    api_key_env: "KODIK_API_KEY"

# ============================================================
# МОДЕЛИ (с указанием провайдера через слэш: <provider>/<model>)
# ============================================================
models:
  # --- DeepSeek V4 Flash Latest: дёшево, контекст 1.3M ---
  deepseek_flash:
    id: "~deepseek/deepseek-v4-flash-latest"
    provider: "kodik"
    context: 1310720
    description: "Быстрая и дешёвая. Для Аналитика, Мастера, Модератора, Лора."

  # --- AionLabs Aion-3.0-Mini: специализирована для RPG ---
  aion_mini:
    id: "aionlabs/aion-3.0-mini"
    provider: "kodik"
    context: 131072
    description: "Заточена под ролевые игры. Резерв для Мастера."

# ============================================================
# РОЛИ (какая модель за что отвечает)
# ============================================================
roles:
  analyst:   "deepseek_flash"   # Разбор команд игрока в JSON
  master:    "deepseek_flash"   # Художественный текст, сцены
  moderator: "deepseek_flash"   # Проверка контента
  lore:      "deepseek_flash"   # Ответы на лор-вопросы (RAG)

# ============================================================
# ПАРАМЕТРЫ ГЕНЕРАЦИИ ПО УМОЛЧАНИЮ
# ============================================================
defaults:
  temperature: 0.7
  max_tokens: 1024
  timeout: 60  # секунд

# ============================================================
# РЕТРАИ (для core/llm_client.py)
# ============================================================
retries:
  max_retries: 3
  base_delay: 1.0   # секунды
  max_delay: 30.0   # секунды